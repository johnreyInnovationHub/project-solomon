function showToast(msg, type='info') {
  let t = document.getElementById('global-toast');
  if (!t) { t = document.createElement('div'); t.id='global-toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg; t.className = `toast ${type} show`;
  clearTimeout(_toastTimer); _toastTimer = setTimeout(()=>t.classList.remove('show'), 3500);
}

function getSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); } catch { return null; } }
function setSession(data) { localStorage.setItem(SESSION_KEY, JSON.stringify(data)); }
function clearSession() { localStorage.removeItem(SESSION_KEY); }

/* ══════════════════════════════════════════════
   API LAYER — Google Sheets via Apps Script
══════════════════════════════════════════════ */
/* ══ PASTE YOUR GOOGLE APPS SCRIPT URL BETWEEN THE QUOTES BELOW ══ */
const HARDCODED_API_URL = 'https://script.google.com/macros/s/AKfycbxjrl_Uq_wO4MsjB6f_v9MOQ13FrFccQxDsykZO-N5CGG7jm7oCMCqmY6roNytUZngn/exec';
/* ══════════════════════════════════════════════════════════════ */
function getApiUrl() {
  return HARDCODED_API_URL !== 'YOUR_APPS_SCRIPT_URL_HERE'
    ? HARDCODED_API_URL
    : (localStorage.getItem('solomon_api_url') || '');
}

async function sheetsPost(action, payload={}) {
  const url = getApiUrl();
  if (!url) return { ok:false, error:'no_api' };
  const body = JSON.stringify({ action, ...payload });
  // Use a 10-second timeout so it never hangs forever
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    await fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      redirect: 'follow',
      body: body,
      signal: controller.signal
    });
    clearTimeout(timer);
    // no-cors = opaque response, but the write reached the server
    return { ok: true, opaque: true };
  } catch(e) {
    clearTimeout(timer);
    if (e.name === 'AbortError') {
      // Timed out — still return ok:true optimistically for writes
      // (the request likely reached Google's servers)
      return { ok: true, opaque: true, timedOut: true };
    }
    // Network error — try GET fallback
    try { return await sheetsGet(action, payload); }
    catch(e2) { return { ok: true, opaque: true }; } // still optimistic
  }
}

async function sheetsGet(action, params={}) {
  const url = getApiUrl();
  if (!url) return { ok:false, error:'no_api' };
  const qs = new URLSearchParams({ action, ...params }).toString();
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 12000);
  try {
    const res = await fetch(`${url}?${qs}`, { redirect:'follow', signal: controller.signal });
    clearTimeout(timer);
    const text = await res.text();
    try { return JSON.parse(text); }
    catch { return { ok:false, error:'bad_json', raw: text.substring(0,200) }; }
  } catch(e) {
    clearTimeout(timer);
    return { ok:false, error: e.name==='AbortError' ? 'timeout' : e.message };
  }
}

/* ─── LOCAL fallback (for quizzes which teacher creates) ─── */
function getLocalData(key) { try { return JSON.parse(localStorage.getItem(`s_${key}`)||'[]'); } catch { return []; } }
function setLocalData(key, data) { localStorage.setItem(`s_${key}`, JSON.stringify(data)); }
function addLocalData(key, item) {
  const arr = getLocalData(key);
  const record = { ...item, id:Date.now(), createdAt:new Date().toISOString() };
  arr.push(record); setLocalData(key, arr); return record;
}

/* ══════════════════════════════════════════════
   STUDENT CACHE (per email, 30-min TTL)
══════════════════════════════════════════════ */
function cacheStudent(student) {
  if (!student||!student.email) return;
  localStorage.setItem(`s_stu_${student.email.toLowerCase()}`, JSON.stringify({...student, _cachedAt:Date.now()}));
}
function getCachedStudent(email) {
  try {
    const raw = localStorage.getItem(`s_stu_${email.toLowerCase()}`);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (Date.now() - s._cachedAt > 30*60*1000) return null; // expired
    return s;
  } catch { return null; }
}
function bustStudentCache(email) { localStorage.removeItem(`s_stu_${email.toLowerCase()}`); }

/* ══════════════════════════════════════════════
   STUDENTS
══════════════════════════════════════════════ */

/** Register — writes to Sheets (primary). localStorage = session cache only. */
async function saveStudent(student) {
  const payload = { ...student, status:'pending', xp:0, lootBags:0, createdAt:new Date().toISOString() };
  if (!getApiUrl()) return { ok:false, error:'⚠ Google Sheets is not configured. Contact your teacher.' };
  // Always cache locally first so the student sees pending state immediately
  cacheStudent(payload);
  // Fire POST to Sheets (no-cors = always "succeeds" from our perspective)
  sheetsPost('addStudent', payload); // fire and don't await — don't block on it
  return { ok:true };
}

/** Fetch student by email — Sheets first, 30-min cache fallback */
async function fetchStudent(email) {
  const result = await sheetsGet('getStudent', { email: email.toLowerCase() });
  if (result.ok && result.student) {
    cacheStudent(result.student);
    return result.student;
  }
  // Use cache as fallback (e.g. brief network issue)
  return getCachedStudent(email);
}

/** Teacher: get all students from Sheets */
async function getStudents() {
  const result = await sheetsGet('getStudents');
  if (result.ok && result.students) return result.students;
  return []; // Sheets is the source of truth
}

/** Update student in Sheets + local cache */
async function updateStudent(email, updates) {
  const cached = getCachedStudent(email);
  if (cached) cacheStudent({...cached, ...updates}); // optimistic cache update
  await sheetsPost('updateStudent', { email:email.toLowerCase(), ...updates });
}

/* ══════════════════════════════════════════════
   QUIZZES — local primary (teacher), Sheets backup
   Students fetch from Sheets
══════════════════════════════════════════════ */
function getQuizzes() { return getLocalData('quizzes'); }

function saveQuiz(quiz) {
  const record = addLocalData('quizzes', quiz);
  // Use POST (no-cors) for large payloads like questions JSON
  sheetsPost('addQuiz', {
    id: String(record.id), title:quiz.title, subject:quiz.subject||'',
    time:String(quiz.time||15), sections:(quiz.sections||[]).join(','),
    locked:'false', category:quiz.category||'practice',
    questions:JSON.stringify(quiz.questions||[]), createdAt:record.createdAt
  });
  return record;
}

function updateQuiz(id, updates) {
  const quizzes = getLocalData('quizzes');
  const idx = quizzes.findIndex(q=>q.id==id);
  if (idx<0) return;
  quizzes[idx] = {...quizzes[idx],...updates};
  setLocalData('quizzes', quizzes);
  sheetsPost('updateQuiz', { id, ...updates });
}

function getQuiz(id) { return getLocalData('quizzes').find(q=>q.id==id)||null; }

/** Students fetch their quizzes from Sheets */
async function fetchQuizzesForStudent(section) {
  const result = await sheetsGet('getQuizzes', { section });
  if (result.ok && result.quizzes) {
    result.quizzes.forEach(q => {
      if (typeof q.questions==='string') { try { q.questions=JSON.parse(q.questions); } catch { q.questions=[]; } }
      if (typeof q.sections==='string') q.sections=q.sections.split(',').map(s=>s.trim());
    });
    return result.quizzes;
  }
  // Fallback: local (same device)
  return getLocalData('quizzes').filter(q=>!q.locked&&(q.sections||[]).includes(section));
}

/* ══════════════════════════════════════════════
   SCORES
══════════════════════════════════════════════ */
async function saveScore(entry) {
  await sheetsPost('addScore', entry);
  const xpGain = Math.round((entry.score/entry.total)*50);
  const student = getCachedStudent(entry.email);
  if (student) {
    const newXP = (parseInt(student.xp)||0) + xpGain;
    const newLoot = entry.score===entry.total ? (parseInt(student.lootBags)||0)+1 : (parseInt(student.lootBags)||0);
    await updateStudent(entry.email, { xp:newXP, lootBags:newLoot });
  }
}

async function getScores() {
  const result = await sheetsGet('getScores');
  return (result.ok && result.scores) ? result.scores : [];
}

async function getStudentScores(email) {
  const result = await sheetsGet('getStudentScores', { email:email.toLowerCase() });
  return (result.ok && result.scores) ? result.scores : [];
}

/* ─── QUIZ PARSER ─── */
function parseQuizHTML(htmlString) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(htmlString, 'text/html');
  const questions = [];
  doc.querySelectorAll('ol > li, .question, [class*="question"]').forEach(qEl => {
    const qText = qEl.querySelector('p,.question-text')?.textContent.trim() || qEl.firstChild?.textContent.trim()||'';
    if (!qText) return;
    const opts=[]; let correct=0;
    qEl.querySelectorAll('li,.option,input[type="radio"]+label').forEach((opt,oi)=>{
      const txt=opt.textContent.trim().replace(/^[A-Da-d][.)]\s*/,'');
      if(!txt||txt===qText) return;
      opts.push(txt);
      if(opt.dataset.correct==='true'||opt.classList.contains('correct')) correct=oi;
    });
    if(opts.length>=2) questions.push({question:qText,options:opts,correct});
  });
  if(questions.length===0){
    const lines=(doc.body.innerText||doc.body.textContent||'').split('\n').map(l=>l.trim()).filter(Boolean);
    let cur=null;
    lines.forEach(line=>{
      if(/^\d+[.)]\s/.test(line)){if(cur&&cur.options.length>=2)questions.push(cur);cur={question:line.replace(/^\d+[.)]\s*/,''),options:[],correct:0};}
      else if(cur&&/^[A-Da-d][.)]\s/.test(line)){const ok=line.includes('*')||line.includes('✓');const txt=line.replace(/^[A-Da-d][.)]\s*/,'').replace(/[*✓]/g,'').trim();if(ok)cur.correct=cur.options.length;cur.options.push(txt);}
    });
    if(cur&&cur.options.length>=2)questions.push(cur);
  }
  return questions;
}

  {id:'luna',emoji:'🌙',label:'Lunara',universe:'Wizardlands'},
  {id:'nev',emoji:'🌱',label:'Bloomcaster',universe:'Wizardlands'},
  // Shinobi Realm
  {id:'nar',emoji:'🍜',label:'Rasenwave',universe:'Shinobi Realm'},
  {id:'sas',emoji:'⚡',label:'Sharinkai',universe:'Shinobi Realm'},
  {id:'sak',emoji:'💪',label:'Forceblossom',universe:'Shinobi Realm'},
  {id:'kak',emoji:'👁️',label:'Veilmaster',universe:'Shinobi Realm'},
  {id:'rock',emoji:'🥊',label:'Hardstone',universe:'Shinobi Realm'},
  // Strix Division
  {id:'anya',emoji:'🧠',label:'Mindreader',universe:'Strix Division'},
  {id:'loid',emoji:'🎭',label:'Phantom',universe:'Strix Division'},
  {id:'yor',emoji:'🌸',label:'Thornrose',universe:'Strix Division'},
  {id:'bond',emoji:'🐾',label:'Futures',universe:'Strix Division'},
  {id:'frank',emoji:'🔍',label:'Watcher',universe:'Strix Division'},
];
function getAvatarById(id){return AVATARS.find(a=>a.id===id)||AVATARS[0];}

/* ─── XP ─── */
function getLevel(xp){
  const lv=[{min:0,label:'Novice Hero',next:100},{min:100,label:'Grasslands Scout',next:250},{min:250,label:'Land of Ooo Explorer',next:500},
    {min:500,label:'Candy Kingdom Guard',next:1000},{min:1000,label:'Ooo Champion',next:2000},
    {min:2000,label:'Ancient Hero',next:4000},{min:4000,label:'Excellence is a Habit',next:Infinity}];
  for(let i=lv.length-1;i>=0;i--){if(xp>=lv[i].min)return{...lv[i],xp,progress:i<lv.length-1?Math.min(100,((xp-lv[i].min)/(lv[i].next-lv[i].min))*100):100};}
  return{...lv[0],xp,progress:0};
}

/* ─── LOOT ─── */
const LOOT_REWARDS=[
  {id:'choco',emoji:'🍫',name:'Chocolate Bar',rarity:'Common'},{id:'pen',emoji:'✏️',name:'Cosmic Pen',rarity:'Common'},
  {id:'note',emoji:'📓',name:'Galaxy Notebook',rarity:'Uncommon'},{id:'sticker',emoji:'⭐',name:'Star Sticker Pack',rarity:'Common'},
  {id:'ruler',emoji:'📏',name:'Nebula Ruler',rarity:'Common'},{id:'medal',emoji:'🥇',name:'Gold Medal',rarity:'Rare'},
  {id:'eraser',emoji:'🧹',name:'Space Eraser',rarity:'Common'},{id:'clip',emoji:'📎',name:'Comet Clips Set',rarity:'Uncommon'},
];
function rollLoot(){
  const w=LOOT_REWARDS.map(r=>r.rarity==='Rare'?1:r.rarity==='Uncommon'?3:6);
  const t=w.reduce((a,b)=>a+b,0); let r=Math.random()*t;
  for(let i=0;i<LOOT_REWARDS.length;i++){r-=w[i];if(r<=0)return LOOT_REWARDS[i];}
  return LOOT_REWARDS[0];
}

/* ─── UTILS ─── */
function timeAgo(d){const s=(Date.now()-new Date(d))/1000;if(s<60)return'just now';if(s<3600)return`${Math.floor(s/60)}m ago`;if(s<86400)return`${Math.floor(s/3600)}h ago`;return`${Math.floor(s/86400)}d ago`;}
function formatDate(d){return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function showLoading(el,msg='Loading...'){if(typeof el==='string')el=document.getElementById(el);if(el)el.innerHTML=`<div style="text-align:center;padding:2rem;color:var(--text-muted);"><div class="spinner"></div><p style="margin-top:1rem;font-size:0.85rem;">${msg}</p></div>`;}

// Background handled by each page inline

</script>
<script>
/* ════════ SETUP ════════ */
const params    = new URLSearchParams(location.search);
const quizId    = params.get('id');
const isPreview = params.get('preview') === '1';
const sess      = getSession();

let student      = null;
let quiz         = null;
let currentQ     = 0;
let score        = 0;
let answers      = [];
let answered     = false;
let timerInterval;
let secondsLeft;
let tabCount     = 0;
let quizStarted  = false;

/* ════════ ANTI-CHEAT ════════ */
// Block right-click
document.addEventListener('contextmenu', e => e.preventDefault());

// Block keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'PrintScreen' || (e.altKey && e.key === 'PrintScreen')) { e.preventDefault(); blackout(); }
  if (e.shiftKey && e.metaKey && e.key.toLowerCase() === 's') { e.preventDefault(); blackout(); }
  if (e.ctrlKey && 'cvuspa'.includes(e.key.toLowerCase())) e.preventDefault();
  if (e.key === 'F12') e.preventDefault();
  if (e.key === 'F5' && quizStarted) e.preventDefault();
});

// Block selection and copy
document.addEventListener('selectstart', e => { if (quizStarted) e.preventDefault(); });
document.addEventListener('copy',        e => { if (quizStarted) e.preventDefault(); });
document.addEventListener('cut',         e => { if (quizStarted) e.preventDefault(); });
document.addEventListener('dragstart',   e => { if (quizStarted) e.preventDefault(); });

// Block screen recording
if (navigator.mediaDevices?.getDisplayMedia) {
  const _orig = navigator.mediaDevices.getDisplayMedia.bind(navigator.mediaDevices);
  navigator.mediaDevices.getDisplayMedia = function(c) {
    if (quizStarted) { blackout(); return Promise.reject(new DOMException('Blocked','NotAllowedError')); }
    return _orig(c);
  };
}

// Tab switch detection
document.addEventListener('visibilitychange', () => {
  if (!quizStarted) return;
  if (document.hidden) {
    tabCount++;
    updateTabWarning();
    document.getElementById('ac-overlay').classList.remove('hidden');
  }
});
window.addEventListener('blur', () => {
  if (!quizStarted) return;
  tabCount++;
  updateTabWarning();
  document.getElementById('ac-overlay').classList.remove('hidden');
});

function resumeQuiz() {
  document.getElementById('ac-overlay').classList.add('hidden');
}

function updateTabWarning() {
  const el = document.getElementById('tab-warn');
  document.getElementById('tab-num').textContent = tabCount;
  el.classList.add('visible');
}

// Screenshot blackout
let _bko;
function blackout() {
  if (!quizStarted) return;
  const el = document.getElementById('bko');
  el.style.display = 'flex'; clearTimeout(_bko);
  _bko = setTimeout(() => el.style.display = 'none', 2500);
  tabCount++;
}

/* ════════ LOAD QUIZ FROM CLOUD ════════ */
async function init() {
  // Auth check
  if (!isPreview && !sess) { window.location.href = 'index.html'; return; }

  // Load student profile
  if (!isPreview && sess?.role === 'student') {
    student = await fetchStudent(sess.email);
    if (!student) { showToast('Could not load your profile', 'error'); }
    else {
      // Set watermark
      document.getElementById('watermark-ac').textContent =
        `${student.name} · ${student.email} · PROJECT SOLOMON`;
    }
  }

  // Load quiz — try Sheets first (works on any device), fallback to local
  quiz = await loadQuizById(quizId);

  if (!quiz || !quiz.questions || quiz.questions.length === 0) {
    // Debug: show what we got
    const debugInfo = quiz ? `Quiz found: "${quiz.title}" but questions=${JSON.stringify(quiz.questions).substring(0,100)}` : 'Quiz not found in Sheets or localStorage';
    document.getElementById('loading-screen').innerHTML = `
      <div style="text-align:center;padding:2rem;max-width:600px;margin:0 auto;">
        <div style="font-size:3rem;margin-bottom:1rem;">😞</div>
        <h2 style="font-family:'Orbitron',monospace;font-size:1rem;color:var(--cosmic-magenta);">QUESTIONS NOT LOADED</h2>
        <p style="color:var(--text-secondary);margin:1rem 0;">The quiz was found but questions are missing from Google Sheets.</p>
        <div style="background:rgba(0,0,0,0.4);border:1px solid rgba(0,212,255,0.2);border-radius:8px;padding:0.75rem;font-family:monospace;font-size:0.72rem;color:#0f0;text-align:left;margin:1rem 0;word-break:break-all;">${debugInfo}</div>
        <p style="color:var(--text-muted);font-size:0.82rem;">Ask your teacher to go to Quiz Portal → ☁ Sync to Sheets</p>
        <a href="student.html" class="btn btn-ghost btn-sm" style="margin-top:1rem;">← Return to Base</a>
      </div>`;
    return;
  }

  // Hide loader, show quiz
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('quiz-screen').classList.remove('hidden');
  document.getElementById('quiz-title-header').textContent = quiz.title;
  secondsLeft = (parseInt(quiz.time) || 15) * 60;
  // Show mode badge in HUD
  const modeBadge = document.getElementById('mode-badge');
  const isAssessmentMode = (quiz.category || 'practice') === 'assessment';
  modeBadge.style.display = 'inline-block';
  if (isAssessmentMode) {
    modeBadge.textContent = '📝 ASSESSMENT';
    modeBadge.style.cssText += ';background:rgba(255,45,155,0.15);color:var(--cosmic-magenta);border:1px solid rgba(255,45,155,0.3);display:inline-block;font-size:0.72rem;font-weight:700;letter-spacing:0.1em;padding:0.25rem 0.75rem;border-radius:50px;';
  } else {
    modeBadge.textContent = '🎯 PRACTICE';
    modeBadge.style.cssText += ';background:rgba(0,212,255,0.12);color:var(--cosmic-cyan);border:1px solid rgba(0,212,255,0.3);display:inline-block;font-size:0.72rem;font-weight:700;letter-spacing:0.1em;padding:0.25rem 0.75rem;border-radius:50px;';
  }
  renderDots();
  renderQuestion();
  quizStarted = true; // set AFTER render so tab detection doesn't fire during loading
  startTimer();
}

/* ════════ LOAD QUIZ BY ID ════════ */
function parseQuizData(q) {
  if (!q) return null;
  // Parse questions from JSON string if needed
  if (typeof q.questions === 'string') {
    try { q.questions = JSON.parse(q.questions); } catch { q.questions = []; }
  }
  if (!Array.isArray(q.questions)) q.questions = [];
  // Parse sections
  if (typeof q.sections === 'string') {
    q.sections = q.sections.split(',').map(s => s.trim()).filter(Boolean);
  }
  // Ensure time is a valid number (default 15 min)
  q.time = parseInt(q.time) || 15;
  // Ensure category is set
  q.category = q.category || 'practice';
  return q;
}

async function loadQuizById(id) {
  // 1. Try local first (fast, works for teacher preview on same device)
  const local = getQuiz(id);
  if (local && local.questions && local.questions.length > 0) return parseQuizData(local);

  // 2. Fetch directly by ID from Sheets
  const result = await sheetsGet('getQuizById', { id: String(id) });
  if (result.ok && result.quiz) {
    const q = parseQuizData(result.quiz);
    if (q && q.questions.length > 0) return q;
  }

  // 3. Fallback: fetch all quizzes for student section and find matching id
  const section = student?.section || '';
  const quizzes = await fetchQuizzesForStudent(section);
  const found = quizzes.find(q => String(q.id) === String(id));
  return found ? parseQuizData(found) : null;
}

/* ════════ DOTS ════════ */
function renderDots() {
  document.getElementById('q-dots').innerHTML = quiz.questions.map((_,i) =>
    `<div class="q-dot ${i < currentQ ? 'done' : i === currentQ ? 'current' : ''}" id="dot-${i}"></div>`
  ).join('');
}

/* ════════ TIMER ════════ */
function startTimer() {
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    secondsLeft--;
    updateTimerDisplay();
    if (secondsLeft <= 0) { clearInterval(timerInterval); showToast("Time's up!", 'error'); setTimeout(finishQuiz, 800); }
  }, 1000);
}
function updateTimerDisplay() {
  const m = Math.floor(secondsLeft / 60), s = secondsLeft % 60;
  const el = document.getElementById('timer');
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.className = `timer-display ${secondsLeft <= 30 ? 'danger' : secondsLeft <= 60 ? 'warn' : ''}`;
}

/* ════════ RENDER QUESTION ════════ */
function renderQuestion() {
  const q = quiz.questions[currentQ];
  answered = false;
  document.getElementById('q-num').textContent = `QUESTION ${currentQ+1} OF ${quiz.questions.length}`;
  document.getElementById('question-text').textContent = q.question;
  document.getElementById('score-live').textContent = `${score}/${currentQ}`;
  document.getElementById('next-btn').style.display = 'none';
  const fb = document.getElementById('answer-feedback');
  fb.style.display = 'none'; fb.textContent = '';

  document.getElementById('answer-opts').innerHTML = q.options.map((opt, i) =>
    `<button class="answer-opt" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}) ${opt}</button>`
  ).join('');
  renderDots();
}

/* ════════ ANSWER ════════ */
function selectAnswer(i) {
  if (answered) return;
  answered = true;
  const q = quiz.questions[currentQ];
  const isAssessment = (quiz.category || 'practice') === 'assessment';
  const opts = document.querySelectorAll('.answer-opt');
  const isCorrect = i === q.correct;

  if (isAssessment) {
    // ── ASSESSMENT MODE: hide right/wrong, just mark selected ──
    opts[i].style.borderColor = 'var(--cosmic-magenta)';
    opts[i].style.background  = 'rgba(255,45,155,0.12)';
    opts[i].style.color       = 'var(--text-primary)';
    opts.forEach(o => o.disabled = true);
    const fb = document.getElementById('answer-feedback');
    fb.style.cssText = 'display:block;padding:0.6rem 1rem;border-radius:8px;font-size:0.82rem;background:rgba(255,45,155,0.06);border-left:3px solid var(--cosmic-magenta);color:var(--cosmic-magenta);';
    fb.textContent = '✓ Answer recorded. Move to next question.';
  } else {
    // ── PRACTICE MODE: show correct/wrong immediately ──
    opts[i].classList.add(isCorrect ? 'correct' : 'wrong');
    opts[q.correct].classList.add('correct');
    opts.forEach(o => o.disabled = true);
    const fb = document.getElementById('answer-feedback');
    fb.style.display = 'block';
    if (isCorrect) {
      fb.style.cssText = 'display:block;padding:0.75rem 1rem;border-radius:8px;font-size:0.88rem;background:rgba(0,255,136,0.08);border-left:3px solid var(--cosmic-green);color:var(--cosmic-green);';
      fb.textContent = '✓ Correct! Well done!';
      const xpEl = document.createElement('div');
      xpEl.className = 'xp-flash'; xpEl.textContent = '+XP';
      document.body.appendChild(xpEl);
      setTimeout(() => xpEl.remove(), 1200);
    } else {
      fb.style.cssText = 'display:block;padding:0.75rem 1rem;border-radius:8px;font-size:0.88rem;background:rgba(255,68,68,0.08);border-left:3px solid #ff4444;color:#ff6666;';
      fb.textContent = `✗ Incorrect. Correct answer: ${String.fromCharCode(65+q.correct)}) ${q.options[q.correct]}`;
    }
  }

  if (isCorrect) score++;
  answers.push({ question: q.question, selected: i, correct: q.correct, isCorrect });
  document.getElementById('dot-'+currentQ).classList.add('done');
  const nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = currentQ >= quiz.questions.length - 1 ? '🏁 Finish Mission' : 'Next Question →';
  nextBtn.style.display = 'block';
}

function nextQuestion() {
  if (!answered) { showToast('Please select an answer first!', 'error'); return; }
  currentQ++;
  if (currentQ >= quiz.questions.length) { finishQuiz(); return; }
  renderQuestion();
}

/* ════════ FINISH ════════ */
async function finishQuiz() {
  clearInterval(timerInterval);
  quizStarted = false;

  const total  = quiz.questions.length;
  const pct    = Math.round(score / total * 100);
  const xp     = Math.round((score / total) * 50);
  const isPerfect = score === total;
  const elapsed   = (quiz.time || 15) * 60 - secondsLeft;

  // Save score to Sheets (works cross-device)
  if (!isPreview && student) {
    await saveScore({
      email:      student.email,
      name:       student.name,
      section:    student.section,
      quizId:     quiz.id,
      quizTitle:  quiz.title,
      category:   quiz.category || 'practice',
      score, total, xp,
      tabSwitches: tabCount,
      timeTaken:  `${Math.floor(elapsed/60)}m ${elapsed%60}s`,
      createdAt:  new Date().toISOString()
    });
  }

  // Show result screen
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');

  const col = pct>=90?'var(--cosmic-green)':pct>=75?'var(--cosmic-cyan)':pct>=50?'var(--star-gold)':'#ff4444';
  const circle = document.getElementById('result-circle');
  circle.style.cssText = `background:${col}22;border:3px solid ${col};color:${col};width:140px;height:140px;border-radius:50%;margin:0 auto 1.5rem;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:2rem;font-weight:700;`;
  circle.textContent = `${pct}%`;

  document.getElementById('result-stars').textContent = pct===100?'⭐⭐⭐':pct>=75?'⭐⭐':pct>=50?'⭐':'';
  const titleMap = [[90,'🌌 Galaxy Sovereign!'],[75,'🚀 Mission Success!'],[50,'✅ Quest Complete'],[0,'💪 Keep Training']];
  document.getElementById('result-title').textContent = titleMap.find(([t])=>pct>=t)[1];
  document.getElementById('result-sub').textContent = isPerfect
    ? '🎁 PERFECT SCORE! You earned a Loot Bag!' : `You answered ${score} of ${total} correctly.`;
  document.getElementById('r-score').textContent = `${score}/${total}`;
  document.getElementById('r-pct').textContent   = `${pct}%`;
  document.getElementById('r-xp').textContent    = `+${xp}`;
  if (isPerfect) document.getElementById('r-loot-notice').classList.remove('hidden');
  if (tabCount > 0) {
    const tabEl = document.getElementById('r-tabs');
    tabEl.style.display = 'block';
    tabEl.textContent = `⚠ ${tabCount} tab switch(es) detected — logged to teacher.`;
  }

  const isAssessment = (quiz.category || 'practice') === 'assessment';

  // Question review — only shown for Practice mode
  if (isAssessment) {
    document.getElementById('review-section').innerHTML = `
      <div style="text-align:center;padding:2rem;background:rgba(255,45,155,0.06);border:1px solid rgba(255,45,155,0.2);border-radius:12px;margin-top:1rem;">
        <div style="font-size:2rem;margin-bottom:0.75rem;">📝</div>
        <p style="font-weight:600;color:var(--cosmic-magenta);margin-bottom:0.4rem;">Assessment Mode</p>
        <p style="font-size:0.85rem;color:var(--text-secondary);line-height:1.6;">Individual answers and correct answers are not shown in assessment mode.<br>Your teacher will review your results.</p>
      </div>`;
    // Also hide individual score, show only final percentage
    document.getElementById('r-score').closest('.stat-card').style.display = 'none';
  } else {
    document.getElementById('review-section').innerHTML = `
      <h3 style="font-family:'Orbitron',monospace;font-size:0.82rem;letter-spacing:0.1em;color:var(--text-secondary);margin-bottom:1rem;">📋 QUESTION REVIEW</h3>
      ${answers.map((a,i) => `
        <div style="background:${a.isCorrect?'rgba(0,255,136,0.06)':'rgba(255,68,68,0.06)'};border:1px solid ${a.isCorrect?'rgba(0,255,136,0.2)':'rgba(255,68,68,0.2)'};border-radius:8px;padding:0.9rem;margin-bottom:0.5rem;text-align:left;">
          <p style="font-size:0.82rem;font-weight:500;">${i+1}. ${a.question}</p>
          <p style="font-size:0.78rem;margin-top:0.4rem;color:${a.isCorrect?'var(--cosmic-green)':'#ff6666'};">
            ${a.isCorrect?'✓':'✗'} ${String.fromCharCode(65+a.selected)}) ${quiz.questions[i].options[a.selected]}
            ${!a.isCorrect?` → Correct: ${String.fromCharCode(65+a.correct)}) ${quiz.questions[i].options[a.correct]}`:''}
          </p>
        </div>`).join('')}`;
  }
}

function confirmExit() {
  if (confirm('Exit quiz? Your progress will be lost.')) {
    clearInterval(timerInterval);
    window.location.href = isPreview ? 'teacher.html' : 'student.html';
  }
}

init();
</script>
